[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topicsplit-pro"
version = "1.0.0"
description = "Batch semantic text grouper — split articles, transcripts, and notes into topic segments by meaning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Andrew", email = "andrwspt@proton.me" },
]
keywords = ["text", "split", "semantic", "topic", "obsidian", "pkm", "notes", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
topicsplit = "topicsplit_pro.cli:cli"
topicsplit-pro = "topicsplit_pro.cli:cli"

[project.urls]
Homepage = "https://github.com/andrwspt/topicsplit"
Documentation = "https://github.com/andrwspt/topicsplit"
Repository = "https://github.com/andrwspt/topicsplit"
"Bug Tracker" = "https://github.com/andrwspt/topicsplit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/topicsplit_pro"]
