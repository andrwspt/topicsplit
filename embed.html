<html>
<head>
<style>
.topicsplit-embed{border:1px solid #2b3340;background:#161b22;color:#e6edf3;padding:16px;border-radius:12px;font-family:system-ui,Segoe UI,sans-serif;max-width:400px;box-sizing:border-box;}
.topicsplit-embed div:nth-child(1){font-size:13px;font-weight:700;margin-bottom:8px;color:#4dd0a7;}
.topicsplit-embed div:nth-child(2){font-size:12px;color:#8b98a5;margin-bottom:12px;line-height:1.5;}
.topicsplit-embed button{background:#4dd0a7;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px;}
.topicsplit-embed a{color:#58a6ff;text-decoration:none;font-size:12px;}
.topicsplit-embed a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="topicsplit-embed">
  <div>TopicSplit</div>
  <div>Free offline text grouper perfect for Obsidian, Logseq, Notion. Split articles into topic segments by meaning.</div>
  <a href="https://andrwspt.github.io/topicsplit/" target="_blank" rel="noopener">Try TopicSplit →</a>
</div>
</body>
</html>
